<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestra Historia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0a0a0a;
            color: #e8e8e8;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 400;
            font-style: italic;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }
        .header p {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888;
            font-weight: 300;
        }
        hr {
            border: none;
            height: 1px;
            background-color: #222;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .hr-top { margin-bottom: 40px; }
        .hr-bottom { margin-top: 40px; }

        .menu {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 380px;
            gap: 1px;
            background-color: #222;
            border: 1px solid #222;
        }
        .menu a {
            background-color: #0a0a0a;
            color: #e8e8e8;
            text-decoration: none;
            padding: 22px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 400;
            transition: all 0.3s ease;
        }
        .menu a span {
            color: #666;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        .menu a:hover {
            background-color: #fff;
            color: #000;
            padding-left: 36px;
        }
        .menu a:hover span {
            color: #000;
        }

        .footer {
            margin-top: 80px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #444;
        }

        audio { display: none; }
    </style>
</head>
<body>

    <audio id="musica" loop>
        <source src="Instrumental.mp3" type="audio/mpeg" />
    </audio>

    <div class="header">
        <hr class="hr-top" />
        <h1>desde los 4</h1>
        <p>2014 — 2026 &nbsp; // &nbsp; 12 años</p>
        <hr class="hr-bottom" />
    </div>

    <nav class="menu">
        <a href="comienzo.html">Comienzo <span>01</span></a>
        <a href="primaria.html">Primaria <span>02</span></a>
        <a href="secundaria.html">Secundaria <span>03</span></a>
        <a href="cartita.html">Cartita <span>04</span></a>
        <a href="videos.html">Videos <span>05</span></a>
    </nav>

    <div class="footer">haz click para música</div>

    <script>
        const musica = document.getElementById('musica');
        const inicio = 15;
        const fin = 45;

        document.addEventListener('click', function(e) {
            if (musica.paused) {
                if (musica.currentTime < inicio || musica.currentTime >= fin) {
                    musica.currentTime = inicio;
                }
                musica.play();
                document.querySelector('.footer').textContent = '♪  - Instrumental';
            } else if (!e.target.closest('.menu a')) {
                musica.pause();
                document.querySelector('.footer').textContent = 'haz click para música';
            }
        });

        musica.addEventListener('timeupdate', function() {
            if (musica.currentTime >= fin) {
                musica.currentTime = inicio;
            }
        });
    </script>
</body>
</html>
