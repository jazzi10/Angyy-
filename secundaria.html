<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secundaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0a0a0a; color: #e8e8e8; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 50px; width: 100%; max-width: 600px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 48px; font-style: italic; font-weight: 400; }
        hr { border: none; height: 1px; background-color: #222; width: 100%; max-width: 600px; }
        .hr-top { margin-bottom: 30px; } .hr-bottom { margin-top: 30px; }
        .editor-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        
        textarea { 
            width: 100%; 
            min-height: 280px; 
            background-color: #111; 
            border: 1px solid #222; 
            color: #ffffff; /* texto bien visible */
            font-family: 'Playfair Display', serif; /* TIPOGRAFÍA ANTERIOR BONITA */
            font-size: 18px;
            font-style: italic;
            line-height: 1.9; 
            padding: 30px; 
            outline: none; 
        }
        textarea::placeholder { color: #444; font-style: italic; }
        textarea:focus { border-color: #555; }

        .fotos-codigo { display: flex; flex-direction: column; gap: 12px; }
        .fotos-codigo img { width: 100%; border: 1px solid #222; display: block; }

        .menu { display: flex; flex-direction: column; width: 100%; max-width: 600px; border: 1px solid #222; margin-top: 40px; }
        .menu a { background-color: #0a0a0a; color: #e8e8e8; text-decoration: none; padding: 22px 28px; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; }
        .menu a:hover { background-color: #fff; color: #000; }
    </style>
</head>
<body>
    <div class="header">
        <hr class="hr-top" />
        <h1>secundaria</h1>
        <hr class="hr-bottom" />
    </div>

    <div class="editor-container">
        <textarea id="texto" placeholder="En secundaria..."></textarea>

        <!-- AQUÍ PONES TUS IMÁGENES DESDE EL CÓDIGO -->
        <div class="fotos-codigo">
            <img src="a.g.jpg" alt="nosotras">
            <img src="a.jpg">
            <!-- Para agregar más solo copia esta línea: -->
            <!-- <img src="foto2.jpg"> -->
        </div>
    </div>

    <nav class="menu"><a href="indice.html">← Volver al inicio</a></nav>

<script>
const textarea = document.getElementById('texto');
textarea.value = localStorage.getItem('secundariaTexto') || '';
textarea.addEventListener('input', () => localStorage.setItem('secundariaTexto', textarea.value));
</script>
</body>
</html>
